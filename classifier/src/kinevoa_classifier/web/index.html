<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#151c19"><title>Kinevoa · Exercise recognition</title><link rel="icon" type="image/svg+xml" href="/static/kinevoa-icon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png?v=2">

<link rel="manifest" href="/static/manifest.webmanifest?v=2">
<meta name="apple-mobile-web-app-title" content="Kinevoa">
<style>
:root{--studio:#f2f2eb;--ink:#18241e;--muted:#68726b;--lens:#151c19;--live:#bbf5b3;--line:#d6dcd3}*{box-sizing:border-box}body{margin:0;background:var(--studio);color:var(--ink);font-family:"Avenir Next",Avenir,system-ui,sans-serif}main{max-width:740px;margin:auto;padding:24px 20px max(24px,env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.brand{display:flex;align-items:center;gap:7px;font-size:25px;font-weight:750;letter-spacing:-1px}.brand svg{width:32px;height:32px;flex:none}.descriptor{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px}.viewfinder{position:relative;background:var(--lens);border-radius:24px;overflow:hidden;aspect-ratio:3/4;max-height:58vh;min-height:260px}video{width:100%;height:100%;object-fit:contain;display:block}.guide{position:absolute;inset:26px;border:1px solid #ffffff35;border-radius:12px;pointer-events:none}.empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:36px;color:#e5ece5;gap:12px}.empty svg{margin:auto;opacity:.6}.empty p{margin:0;font-size:15px;color:#b6c1b9;line-height:1.5}.live{display:none;position:absolute;top:16px;left:16px;background:var(--live);color:var(--ink);font-size:11px;font-weight:750;letter-spacing:1.3px;padding:7px 10px;border-radius:20px}.live:before{content:' ';display:inline-block;background:var(--ink);width:6px;height:6px;border-radius:50%;margin-right:6px}.prediction{padding:24px 0 22px;border-bottom:1px solid var(--line)}.eyebrow{font-size:11px;letter-spacing:1.7px;text-transform:uppercase;color:var(--muted);margin:0 0 5px}.exercise{font-size:clamp(38px,9vw,62px);font-weight:650;line-height:1.15;letter-spacing:-2px;margin:0}.controls{display:flex;gap:10px;margin-top:20px}button{font:inherit;font-weight:650;border:0;border-radius:14px;min-height:54px;padding:14px 20px;cursor:pointer}button:focus-visible{outline:3px solid #49835c;outline-offset:3px}#start{background:var(--ink);color:var(--studio);flex:1}#stop{background:#e0e5dc;color:var(--ink)}button:disabled{opacity:.45;cursor:default}#message{font-size:14px;line-height:1.5;color:var(--muted);min-height:42px;margin:14px 0 0}#message.error{color:#974130}.privacy{font-size:11px;line-height:1.5;color:var(--muted);margin-top:16px} @media(min-width:650px){main{padding-top:32px}.viewfinder{aspect-ratio:4/3}}
</style></head><body><main><header><span class="brand"><svg viewBox="0 0 96 96" aria-hidden="true"><path d="M20 34V20h14M62 20h14v14M76 62v14H62M34 76H20V62" fill="none" stroke="currentColor" stroke-width="5"/><path d="M38 32v32m2-16 19-16M40 48l21 16" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="square"/></svg>kinevoa</span><span class="descriptor">Exercise recognition</span></header>
<section class="viewfinder" aria-label="Live camera preview"><video id="video" playsinline autoplay muted></video><div class="guide"></div><div id="empty" class="empty"><svg width="48" height="48" viewBox="0 0 48 48" fill="none" aria-hidden="true"><rect x="5" y="12" width="38" height="29" rx="7" stroke="currentColor" stroke-width="1.5"/><circle cx="24" cy="26" r="8" stroke="currentColor" stroke-width="1.5"/><path d="M15 12l3-6h12l3 6" stroke="currentColor" stroke-width="1.5"/></svg><p>Set your phone down.<br>Keep your whole body in view.</p></div><span id="live" class="live">Live</span></section>
<section class="prediction" aria-label="Recognised exercise"><p class="eyebrow">Exercise</p><p id="exercise" class="exercise" role="status" aria-live="polite">Unknown</p></section>
<div class="controls"><button id="start">Start camera</button><button id="stop" disabled>Stop</button></div><p id="message" role="status">Squat · Push-up · Lateral raise</p><p class="privacy">Camera frames are sent to this app’s server for recognition. This app does not save the frames.</p><canvas id="canvas" hidden></canvas>
</main><script>
const video=document.querySelector('#video'),canvas=document.querySelector('#canvas'),label=document.querySelector('#exercise'),message=document.querySelector('#message'),startButton=document.querySelector('#start'),stopButton=document.querySelector('#stop');
let movementSession;
const names={squat:'Squat',pushup:'Push-up','push-up':'Push-up','push up':'Push-up',lateral_raise:'Lateral raise','lateral raise':'Lateral raise','lateral raises':'Lateral raise',unknown:'Unknown'};
let stream=null,active=false,generation=0,history=[],controller=null,timer=null;
function notice(text,error=false){message.textContent=text;message.classList.toggle('error',error)}
function stop(text='Camera stopped.'){active=false;generation++;clearTimeout(timer);controller?.abort();controller=null;stream?.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;history=[];label.textContent='Unknown';document.querySelector('#empty').style.display='grid';document.querySelector('#live').style.display='none';startButton.disabled=false;stopButton.disabled=true;notice(text)}
async function loop(token){if(!active||token!==generation)return;try{if(video.readyState>=2&&video.videoWidth){const scale=Math.min(1,640/Math.max(video.videoWidth,video.videoHeight));canvas.width=Math.round(video.videoWidth*scale);canvas.height=Math.round(video.videoHeight*scale);canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.85));if(!blob)throw Error('Could not read the camera frame.');if(token!==generation)return;const form=new FormData();form.append('file',blob,'frame.jpg');controller=new AbortController();const timeout=setTimeout(()=>controller?.abort(),30000);let response;try{response=await fetch('/predict',{method:'POST',headers:{'X-Movement-Session':movementSession},body:form,signal:controller.signal})}finally{clearTimeout(timeout)}if(!response.ok)throw Error('Recognition is unavailable. Check the laptop server, then start again.');const result=await response.json();if(token!==generation)return;const current=names[result.exercise]||'Unknown';history.push(current);history=history.slice(-3);const stable=history.length===3&&history.every(x=>x===current);label.textContent=stable?current:'Unknown';notice('Keep your whole body in view.');}}catch(error){if(token!==generation)return;stop(error.name==='AbortError'?'Recognition timed out. Check the laptop connection, then start again.':error.message);message.classList.add('error');return}if(active&&token===generation)timer=setTimeout(()=>loop(token),350)}
startButton.onclick=async()=>{stop('Opening camera…');startButton.disabled=true;const token=generation;try{if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia)throw Error('Open this app over HTTPS to use your phone camera.');const acquired=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});if(token!==generation){acquired.getTracks().forEach(t=>t.stop());return}stream=acquired;video.srcObject=stream;await video.play();if(token!==generation)return;movementSession=crypto.randomUUID();active=true;stopButton.disabled=false;document.querySelector('#empty').style.display='none';document.querySelector('#live').style.display='block';notice('Looking for movement…');stream.getVideoTracks()[0].addEventListener('ended',()=>{if(active)stop('Camera disconnected. Start again to reconnect.')});loop(token)}catch(error){if(token!==generation)return;const errors={NotAllowedError:'Camera access was blocked. Allow camera access in your browser settings, then try again.',NotFoundError:'No camera was found on this device.',NotReadableError:'The camera is busy. Close other apps using it, then try again.'};stop(errors[error.name]||error.message);message.classList.add('error')}};
stopButton.onclick=()=>stop();document.addEventListener('visibilitychange',()=>{if(document.hidden&&(active||startButton.disabled))stop('Camera paused. Start again when you’re ready.')});window.addEventListener('pagehide',()=>stop());
</script></body></html>
